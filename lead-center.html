<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPM Energie Lead Center</title><style>body{margin:0;background:#06101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between}.logo{font-weight:900;font-size:22px;color:#58d5ff}.hero{padding:55px 0 25px}.hero h1{font-size:58px;line-height:.95;margin:8px 0}.hero h1 span{color:#58d5ff}.muted{color:#91a5bb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{background:#0b1828;border:1px solid #213951;border-radius:16px;padding:18px}.stat b{font-size:28px;display:block}.search{margin-top:14px}.grid{display:grid;grid-template-columns:1.2fr 1fr .7fr .8fr;gap:10px}.field{color:#a8b9cb;font-size:12px;font-weight:700}.field input,.field select{display:block;width:100%;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #29435d;background:#071321;color:#fff}.go{width:100%;margin-top:12px;padding:15px;border:0;border-radius:11px;background:#45caff;color:#03111c;font-weight:900;font-size:15px}.results{margin-top:12px}.lead{display:grid;grid-template-columns:1fr auto;gap:15px;margin:10px 0}.leadname{font-weight:900}.tag{font-size:10px;color:#63d8ff;margin-left:8px}.meta{color:#879bb0;font-size:12px;margin-top:7px}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.links a{color:#8edfff;text-decoration:none;border:1px solid #23435e;padding:7px 9px;border-radius:8px;font-size:11px}.crm{display:grid;grid-template-columns:140px 1fr 1fr 90px;gap:7px;margin-top:10px}.crm input,.crm select{min-width:0;padding:10px;background:#071321;border:1px solid #29435d;color:#fff;border-radius:8px}.smallbtn{border:1px solid #29435d;background:#102033;color:#fff;border-radius:8px}.empty{text-align:center;padding:42px;color:#91a5bb;border:1px dashed #29435d;border-radius:14px}.score{text-align:right}.msg{margin-top:10px;color:#62e7ad;font-size:12px;min-height:16px}@media(max-width:700px){.stats,.grid,.crm{grid-template-columns:1fr 1fr}.lead{grid-template-columns:1fr}.score{text-align:left}}@media(max-width:480px){.stats,.grid,.crm{grid-template-columns:1fr}.hero h1{font-size:45px}}</style></head><body><main class="wrap"><header class="top"><div><div class="logo">CPM ENERGIE</div><div class="muted">Lead Center</div></div><div class="muted">● Bereit</div></header><section class="hero"><div class="muted">B2B VERTRIEB</div><h1>Finde die<br><span>richtigen Kunden.</span></h1><p class="muted">Gewerbe suchen, Energiepotenzial bewerten und deine Pipeline direkt bearbeiten.</p></section><section class="stats"><div class="box stat"><span class="muted">Gesamt</span><b id="total">0</b></div><div class="box stat"><span class="muted">A Leads</span><b id="a">0</b></div><div class="box stat"><span class="muted">Gespräche</span><b id="talk">0</b></div><div class="box stat"><span class="muted">Abschlüsse</span><b id="deal">0</b></div></section><section class="box search"><h3>Neue Leads finden</h3><div class="grid"><label class="field">Branche<select id="industry"><option>Bäckerei</option><option>Gastronomie</option><option>Hotel</option><option>Metzgerei</option><option>Werkstatt</option><option>Autohaus</option><option>Fitnessstudio</option><option>Supermarkt</option><option>Handwerk</option><option>Produktion / Industrie</option></select></label><label class="field">Ort<input id="city" value="Mainz"></label><label class="field">Radius<select id="radius"><option>5 km</option><option>10 km</option><option>25 km</option><option selected>50 km</option></select></label><label class="field">Mindestpotenzial<select id="min"><option value="0">Alle</option><option value="3">3 / 5</option><option value="4">4 / 5</option><option value="5">5 / 5</option></select></label></div><button id="go" class="go">Leads finden →</button><div id="msg" class="msg"></div></section><div class="muted" style="padding:20px 2px 8px"><b id="count">0</b> Treffer <span id="label"></span></div><section class="box"><div id="results"><div class="empty">Noch keine Leads. Klicke auf <b style="color:#fff">Leads finden</b>.</div></div></section></main><script>(function(){'use strict';var DATA={"Bäckerei":["Bäckerei Schmitt","Backhaus Rhein-Main","Konditorei Müller","Bäckerei am Markt"],"Gastronomie":["Rheinblick Gastronomie","Mainzer Hof","Rhein-Main Catering","Zum Alten Rathaus"],"Hotel":["Hotel Rheinblick","City Hotel Mainz","Rhein-Main Business Hotel"],"Metzgerei":["Metzgerei Becker","Metzgerei am Markt"],"Werkstatt":["AutoService Mainz","KFZ Technik Rhein-Main"],"Autohaus":["Autohaus Rhein-Main","Autozentrum Mainz"],"Fitnessstudio":["Fitnesspark Mainz","Rhein-Main Fitness"],"Supermarkt":["MarktCenter Mainz","Frischemarkt Rhein-Main"],"Handwerk":["Müller Gebäudetechnik GmbH","Rhein-Main Handwerk GmbH"],"Produktion / Industrie":["Rhein-Main Produktion GmbH","Industrie Service GmbH"]};var leads=[];function id(x){return document.getElementById(x)}function render(){var min=Number(id('min').value),f=leads.filter(function(x){return x.score>=min});id('count').textContent=f.length;id('total').textContent=leads.length;id('a').textContent=leads.filter(function(x){return x.score>=4}).length;id('talk').textContent=leads.filter(function(x){return x.status==='Gespräch'}).length;id('deal').textContent=leads.filter(function(x){return x.status==='Abschluss'}).length;if(!f.length){id('results').innerHTML='<div class="empty">Keine passenden Leads.</div>';return}id('results').innerHTML=f.map(function(x,i){return '<article class="box lead"><div><div class="leadname">'+x.name+' <span class="tag">'+x.industry+'</span></div><div class="meta">'+x.address+' · '+x.phone+'</div><div class="links"><a target="_blank" href="https://www.google.com/search?q='+encodeURIComponent(x.name+' '+x.address)+'">Recherche ↗</a><a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+x.lat+','+x.lon+'">Maps ↗</a><a target="_blank" href="https://www.linkedin.com/search/results/companies/?keywords='+encodeURIComponent(x.name)+'">LinkedIn ↗</a></div><div class="crm"><select class="st"><option>Neu</option><option>Recherche</option><option>Kontaktversuch</option><option>Gespräch</option><option>Kein Interesse</option><option>Abschluss</option></select><input class="ct" placeholder="Ansprechpartner / E-Mail"><input class="nt" placeholder="Notiz"><button class="smallbtn save">Speichern</button></div></div><div class="score">'+new Array(x.score+1).join('🔥')+'<br><b>'+x.score+'/5</b></div></article>'}).join('')}id('go').onclick=function(){var ind=id('industry').value,city=id('city').value.trim()||'Mainz',base=(ind==='Produktion / Industrie'||ind==='Bäckerei'||ind==='Hotel'||ind==='Supermarkt')?5:4;id('go').textContent='Leads werden geladen …';id('go').disabled=true;setTimeout(function(){leads=(DATA[ind]||['CPM Demo GmbH']).map(function(name,i){return{name:name,industry:ind,address:'Beispielstraße '+(10+i)+', '+city,phone:'06131 20'+(100+i),lat:49.99+i*.003,lon:8.25+i*.004,score:Math.max(3,base-(i%3===2?1:0)),status:'Neu'}});id('label').textContent='· '+ind+' · '+city;id('msg').textContent='✓ '+leads.length+' Leads gefunden';id('go').textContent='Leads finden →';id('go').disabled=false;render()},400)};id('min').onchange=render;id('results').onclick=function(e){if(!e.target.classList.contains('save'))return;var card=e.target.closest('.lead'),idx=Array.prototype.indexOf.call(document.querySelectorAll('.lead'),card),f=leads.filter(function(x){return x.score>=Number(id('min').value)}),x=f[idx];x.status=card.querySelector('.st').value;x.contact=card.querySelector('.ct').value;x.note=card.querySelector('.nt').value;e.target.textContent='Gespeichert ✓';render()};render()})();</script></body></html>
