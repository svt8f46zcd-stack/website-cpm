<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPM Lead Center Test</title><style>body{margin:0;background:#06101d;color:#fff;font:16px system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#0d1b2b;border:1px solid #24415d;border-radius:18px;padding:20px;margin:14px 0}button,select,input{padding:12px;border-radius:10px;border:1px solid #31506d;background:#081522;color:#fff}button{cursor:pointer;background:#28b0ff;color:#03101b;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lead{padding:15px;border:1px solid #25445f;border-radius:14px;margin:10px 0}.muted{color:#8ea4bb}.score{font-size:13px;color:#61d8ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><div class="wrap"><h1>CPM Energie <span style="color:#61d8ff">Lead Center</span></h1><p class="muted">Direkter Funktionstest. Keine API nötig.</p><div class="card"><div class="grid"><label>Branche<br><select id="industry"><option>Bäckerei</option><option>Gastronomie</option><option>Hotel</option><option>Werkstatt</option><option>Handwerk</option><option>Produktion</option></select></label><label>Ort<br><input id="city" value="Mainz"></label><label>Radius<br><select id="radius"><option>5 km</option><option>10 km</option><option selected>50 km</option></select></label></div><button id="go" style="width:100%;margin-top:12px">LEADS FINDEN →</button></div><div class="card"><b id="count">0</b> Leads <span id="msg" class="muted"></span><div id="results" style="margin-top:12px"><p class="muted">Noch keine Suche.</p></div></div></div><script>document.getElementById('go').addEventListener('click',function(){const industry=document.getElementById('industry').value,city=document.getElementById('city').value||'Mainz';const names={Bäckerei:['Bäckerei Schmitt','Backhaus Rhein-Main','Konditorei Müller','Bäckerei am Markt'],Gastronomie:['Rheinblick Gastronomie','Mainzer Hof','Rhein-Main Catering'],Hotel:['Hotel Rheinblick','City Hotel Mainz','Business Hotel Mainz'],Werkstatt:['AutoService Mainz','KFZ Technik Rhein-Main'],Handwerk:['Müller Gebäudetechnik GmbH','Rhein-Main Handwerk GmbH'],Produktion:['Rhein-Main Produktion GmbH','Industrie Service GmbH']}[industry]||['CPM Demo GmbH'];document.getElementById('count').textContent=names.length;document.getElementById('msg').textContent=' · '+industry+' · '+city;document.getElementById('results').innerHTML=names.map((n,i)=>'<div class="lead"><b>'+n+'</b><div class="muted">Beispielstraße '+(10+i)+', '+city+' · 06131 20'+(100+i)+'</div><div class="score">'+'🔥'.repeat(i%2?4:5)+' · Energiepotenzial</div><p><a target="_blank" href="https://www.google.com/search?q='+encodeURIComponent(n+' '+city)+'">Recherche ↗</a> · <a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n+' '+city)+'">Maps ↗</a> · <a target="_blank" href="https://www.linkedin.com/search/results/companies/?keywords='+encodeURIComponent(n)+'">LinkedIn ↗</a></p><input placeholder="Ansprechpartner / E-Mail"> <input placeholder="Notiz"><select><option>Neu</option><option>Recherche</option><option>Kontaktversuch</option><option>Gespräch</option><option>Abschluss</option></select></div>').join('')});</script></html>
